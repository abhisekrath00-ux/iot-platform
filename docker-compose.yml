services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports: ["5432:5432"]

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"   # lab only; production uses 8883 with mTLS

  api:
    build: ./server
    command: ["/bin/api"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TLS: "false"
      API_PORT: "8000"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      ALERT_FROM_EMAIL: ${ALERT_FROM_EMAIL}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      SECRETS_KEY: ${SECRETS_KEY:-}
      LOCAL_LOGIN: ${LOCAL_LOGIN:-}   # 1 = password sign-in (the installer sets it for the first administrator); leave empty when SSO is used
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}   # CIDR of the web container network; makes per-client rate limits see real client addresses (docs/security.md)
      ELASTICSEARCH_URL: http://elasticsearch:9200
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-0}   # 0 = keep raw telemetry forever; hourly rollups are always kept
    depends_on:
      postgres: {condition: service_healthy}
      elasticsearch: {condition: service_started}
      mosquitto: {condition: service_started}
    ports: ["8000:8000"]

  ingest:
    build: ./server
    command: ["/bin/ingest"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TLS: "false"
    depends_on:
      postgres: {condition: service_healthy}
      mosquitto: {condition: service_started}

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  mcp:
    build: ./server
    command: ["/bin/mcp"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8100:8100"]

  # Optional local AI model (docs/ai-runtime.md). Off unless started with: docker compose --profile ai up
  ai-runtime:
    build: {context: ., dockerfile: deploy/ai-runtime/Dockerfile}
    profiles: ["ai"]
    environment:
      MODEL_NAME: ${AI_MODEL_NAME:-qwen3-1.7b}
      MODEL_QUANT: ${AI_MODEL_QUANT:-Q4_K_M}
      MODEL_SHA256: ${AI_MODEL_SHA256:-}
      AI_THREADS: ${AI_THREADS:-2}
      AI_CONTEXT: ${AI_CONTEXT:-6144}
      AI_RUNTIME_KEY: ${AI_RUNTIME_KEY:-}
    volumes: ["${AI_MODEL_DIR:-./models}:/models:ro"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${AI_MEM_LIMIT:-3g}
    restart: unless-stopped

  redis:
    # Optional: set REDIS_URL=redis:6379 on the api service to share OIDC
    # login state; add CACHE_BACKEND=redis to also share the response cache.
    # login state across replicas. Single-replica deployments can remove this.
    image: redis:7-alpine
    profiles: ["ha"]
    volumes:
      - redisdata:/data

  web:
    build: ./web
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  pgdata:
  esdata:
  redisdata:
