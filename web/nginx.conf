server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 25m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Security headers (locations below define none, so these always apply).
  # Everything is self-hosted: no CDN, fonts or scripts, so the UI works air-gapped.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), serial=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  location / { try_files $uri /index.html; }
  # the worker and manifest must always be revalidated so an update reaches devices
  location = /sw.js { add_header Cache-Control "no-cache"; add_header Content-Security-Policy "default-src 'self'" always; add_header X-Content-Type-Options "nosniff" always; add_header Service-Worker-Allowed "/"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options "nosniff" always; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; add_header Content-Security-Policy "default-src 'self'" always; add_header X-Content-Type-Options "nosniff" always; }
  location /v1/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /auth/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /healthz { proxy_pass http://api:8000; }
}
