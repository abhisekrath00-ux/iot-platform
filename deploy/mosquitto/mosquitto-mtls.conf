# Production broker config: gateways authenticate with client certificates
# issued by the deployment CA (scripts/gen-ca.sh, claim-time signing).
# The lab config (mosquitto.conf, port 1883) must not be used in production.
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key
require_certificate true
use_identity_as_username true
# ACLs: generated by the api at claim time (docs/broker-acl.md). Each
# gateway publishes only under t/<tenant>/g/<gateway-uuid>/... and reads
# commands only under its own subtree, keyed by cert CN (= gateway serial).
acl_file /mosquitto/config/acl
allow_anonymous false
