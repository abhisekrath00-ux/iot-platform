name: Windows installer contracts
on:
  push:
    branches: [main]
    paths: ['scripts/*ps1', 'scripts/test-edge-native-linux.sh', 'edge/packaging/**', 'edge/packaging/*ps1', 'edge/cmd/edge-setup/**', 'scripts/build-edge.sh', '.github/workflows/windows-installer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-windows-powershell-contracts:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Windows PowerShell5.1 parsing and pure contracts (no WSL/Docker installation)
        shell: powershell
        run: |
          $PSVersionTable
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, ProductType
          & ./scripts/test-windows-desktop.ps1
          & ./scripts/test-prereq.ps1
          & ./scripts/test-remove-hexthings-windows.ps1
          & ./scripts/test-edge-windows-exits.ps1
          & ./scripts/test-edge-manager.ps1
          & ./scripts/test-admin-password.ps1
      - name: PowerShell7 pure contracts (no WSL/Docker installation)
        shell: pwsh
        run: |
          ./scripts/test-windows-desktop.ps1
          ./scripts/test-remove-hexthings-windows.ps1
          ./scripts/test-edge-windows-exits.ps1
          ./scripts/test-edge-manager.ps1
          ./scripts/test-admin-password.ps1
      - name: Render actual Windows setup form (no install/start/enrollment)
        shell: powershell
        run: |
          powershell -NoProfile -STA -ExecutionPolicy Bypass -File edge/packaging/setup-wizard.ps1 -RenderPreview "$env:RUNNER_TEMP/hexthings-edge-setup.png"
          if ($LASTEXITCODE -ne 0) { throw 'Form preview failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-edge-setup-form
          path: ${{ runner.temp }}/hexthings-edge-setup.png

  native-windows-edge-service:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: edge/go.sum
      - name: Disposable native service lifecycle (not UAC, GUI click, reboot or telemetry)
        shell: powershell
        run: ./scripts/test-edge-native-windows.ps1
  native-ubuntu-edge-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: edge/go.sum
      - name: Build actual executable installer packages
        run: bash scripts/build-edge.sh 0.0.0-native
      - name: Disposable systemd lifecycle from the .run (not desktop, reboot or telemetry)
        run: sudo -E bash scripts/test-edge-native-linux.sh
