name: Windows installer contracts
on:
  push:
    branches: [main]
    paths: ['scripts/*ps1', 'scripts/test-edge-native-linux.sh', 'edge/packaging/**', 'edge/packaging/*ps1', 'edge/cmd/edge-setup/**', 'scripts/build-edge.sh', '.github/workflows/windows-installer.yml']
  workflow_dispatch:
    inputs:
      linux_root_stopped_review:
        description: 'One disposable root-origin stopped installer gate, no start/enable or artifacts'
        type: boolean
        default: false
      linux_identity_mapping_review:
        description: 'One synthetic privileged Linux mapping check, no service activation or artifacts'
        type: boolean
        default: false
      windows_recovery_review:
        description: 'Windows-only installer recovery contracts, pixels and fixed historical/current service fixture'
        type: boolean
        default: false
      windows_claim_store_prototype:
        description: 'One dormant claim-store package test, synthetic temp only, no services or artifacts'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native-windows-powershell-contracts:
    if: ${{ !inputs.linux_root_stopped_review && !inputs.linux_identity_mapping_review && !inputs.windows_recovery_review && !inputs.windows_claim_store_prototype }}
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Windows PowerShell5.1 parsing and pure contracts (no WSL/Docker installation)
        shell: powershell
        run: |
          $PSVersionTable
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, ProductType
          & ./scripts/test-windows-desktop.ps1
          & ./scripts/test-prereq.ps1
          & ./scripts/test-remove-hexthings-windows.ps1
          & ./scripts/test-edge-windows-exits.ps1
          & ./scripts/test-edge-manager.ps1
          & ./scripts/test-admin-password.ps1
      - name: PowerShell7 pure contracts (no WSL/Docker installation)
        shell: pwsh
        run: |
          ./scripts/test-windows-desktop.ps1
          ./scripts/test-remove-hexthings-windows.ps1
          ./scripts/test-edge-windows-exits.ps1
          ./scripts/test-edge-manager.ps1
          ./scripts/test-admin-password.ps1
      - name: Render actual Windows setup form (no install/start/enrollment)
        shell: powershell
        run: |
          powershell -NoProfile -STA -ExecutionPolicy Bypass -File edge/packaging/setup-wizard.ps1 -RenderPreview "$env:RUNNER_TEMP/hexthings-edge-setup.png"
          if ($LASTEXITCODE -ne 0) { throw 'Form preview failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-edge-setup-form
          path: ${{ runner.temp }}/hexthings-edge-setup.png

  native-windows-edge-service:
    if: ${{ !inputs.linux_root_stopped_review && !inputs.linux_identity_mapping_review && !inputs.windows_recovery_review && !inputs.windows_claim_store_prototype }}
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: edge/go.sum
      - name: Disposable native service lifecycle (not UAC, GUI click, reboot or telemetry)
        shell: powershell
        run: ./scripts/test-edge-native-windows.ps1
  native-ubuntu-edge-run:
    if: ${{ !inputs.linux_root_stopped_review && !inputs.linux_identity_mapping_review && !inputs.windows_recovery_review && !inputs.windows_claim_store_prototype }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: edge/go.sum
      - name: Build actual executable installer packages
        run: bash scripts/build-edge.sh 0.0.0-native
      - name: Disposable systemd lifecycle from the .run (not desktop, reboot or telemetry)
        run: sudo -E bash scripts/test-edge-native-linux.sh

  windows-contracts-and-pixels:
    if: ${{ !inputs.linux_root_stopped_review && github.event_name == 'workflow_dispatch' && !inputs.linux_identity_mapping_review && inputs.windows_recovery_review && !inputs.windows_claim_store_prototype && github.event.repository.private == false }}
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: PowerShell5.1 contracts, no installation
        shell: powershell
        run: |
          & ./scripts/test-edge-windows-exits.ps1
          & ./scripts/test-edge-manager.ps1
          & ./scripts/test-edge-recovery-manager.ps1
          & ./scripts/test-edge-upgrade-transaction.ps1
      - name: PowerShell7 contracts, no installation
        shell: pwsh
        run: |
          ./scripts/test-edge-windows-exits.ps1
          ./scripts/test-edge-manager.ps1
          ./scripts/test-edge-recovery-manager.ps1
          ./scripts/test-edge-upgrade-transaction.ps1
      - name: Actual WinForms pixels, no installation or enrollment
        shell: powershell
        run: |
          powershell -NoProfile -STA -ExecutionPolicy Bypass -File edge/packaging/setup-wizard.ps1 -RenderPreview "$env:RUNNER_TEMP/hexthings-edge-setup.png"
          if ($LASTEXITCODE -ne 0) { throw 'Actual form rendering failed' }
          & ./scripts/emit-windows-preview.ps1
      - name: Actual recovery routing clicks with stand-in backend, no service changes
        shell: powershell
        run: |
          powershell -NoProfile -STA -ExecutionPolicy Bypass -File scripts/test-edge-recovery-clicks-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Recovery routing clicks failed' }
          & ./scripts/emit-windows-preview.ps1
  windows-historical-current-service:
    if: ${{ !inputs.linux_root_stopped_review && github.event_name == 'workflow_dispatch' && !inputs.linux_identity_mapping_review && inputs.windows_recovery_review && !inputs.windows_claim_store_prototype && github.event.repository.private == false }}
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - name: Disposable historical/current SCM install and upgrade recovery
        shell: powershell
        run: |
          powershell -NoProfile -STA -ExecutionPolicy Bypass -File scripts/test-edge-native-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Integrated real backend recovery clicks failed' }
          & ./scripts/emit-windows-preview.ps1

  windows-claim-store-prototype:
    if: ${{ !inputs.linux_root_stopped_review && github.event_name == 'workflow_dispatch' && !inputs.linux_identity_mapping_review && inputs.windows_claim_store_prototype && !inputs.windows_recovery_review && github.event.repository.private == false }}
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - name: Dormant claim-store package only, no service or owner material
        shell: powershell
        env:
          HEX_NATIVE_CANDIDATE_STORE_ACCEPTANCE: '1'
        run: |
          Set-Location edge
          go test -tags hex_candidate_native_prototype ./internal/claim -run '^TestCandidateWindowsPrototype' -count=1 -v -timeout 5m
          if ($LASTEXITCODE -ne 0) { throw 'Dormant native claim store acceptance failed; keep product storage disabled' }

  linux-identity-mapping-review:
    if: ${{ !inputs.linux_root_stopped_review && github.event_name == 'workflow_dispatch' && inputs.linux_identity_mapping_review && !inputs.windows_recovery_review && !inputs.windows_claim_store_prototype && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - name: Compile exact product, no cache or artifacts
        run: cd edge && go build -o "$RUNNER_TEMP/edge-agent-review" ./cmd/edge-agent
      - name: Synthetic ownership and stopped static unit only
        env:
          HEX_DISPOSABLE_LINUX_MAPPING_REVIEW: '1'
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS,HEX_DISPOSABLE_LINUX_MAPPING_REVIEW bash edge/packaging/test-private-linux-mapping.sh "$RUNNER_TEMP/edge-agent-review"

  linux-root-stopped-review:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_root_stopped_review && !inputs.linux_identity_mapping_review && !inputs.windows_recovery_review && !inputs.windows_claim_store_prototype && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-go@v6
      with:
        go-version: '1.26'
        cache: false
    - name: Compile acceptance-only product and harness, no cache or artifacts
      working-directory: edge
      run: 'go build -tags hex_deployment_native_acceptance -o "$RUNNER_TEMP/edge-native-stopped" ./cmd/edge-agent
  
        go test -c -race -tags hex_deployment_native_acceptance -o "$RUNNER_TEMP/stopped-native.test" ./internal/setup
  
        '
    - name: Genuine retained root-origin stopped installer and distinct service user
      run: 'sudo env HEX_NATIVE_STOPPED_ACCEPTANCE=1 HEX_NATIVE_STOPPED_AGENT="$RUNNER_TEMP/edge-native-stopped" "$RUNNER_TEMP/stopped-native.test" -test.run ''^TestNativeRootOriginStoppedInstaller$'' -test.v -test.count=1 -test.timeout=5m
  
        '

  confined-systemd-feasibility:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_root_stopped_review && inputs.linux_identity_mapping_review && inputs.windows_recovery_review && !inputs.windows_claim_store_prototype && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 1
        with:
          persist-credentials: false
      - name: Confirm production directive reference unchanged
        timeout-minutes: 1
        run: cmp edge/packaging/hexmon-edge.service scripts/confined-systemd-probe/production-unit.reference
      - name: Prefetch and build fixed probe image only
        timeout-minutes: 7
        run: |
          test "$(podman --version)" = 'podman version 4.9.3'
          # Distribution roots only, not locally-added runner certificates.
          dpkg-query -W ca-certificates
          test -s /usr/share/ca-certificates/mozilla/ISRG_Root_X1.crt
          cat /usr/share/ca-certificates/mozilla/*.crt > scripts/confined-systemd-probe/bootstrap-ca.crt
          sha256sum scripts/confined-systemd-probe/bootstrap-ca.crt
          sudo timeout --signal=TERM --kill-after=10 90 podman pull docker.io/library/ubuntu@sha256:9a04f13b3f80ef056361e30868593b1cfd2279fe19e4081cb93a90bf56819d6a
          sudo timeout --signal=TERM --kill-after=10 300 podman build --pull=never --iidfile "$RUNNER_TEMP/confined-image.id" scripts/confined-systemd-probe
      - name: Reserve exact owner evidence
        timeout-minutes: 1
        run: sudo install -d -m 700 -o root -g root "$RUNNER_TEMP/confined-owner"
      - name: Confined feasibility, no application activation
        timeout-minutes: 3
        run: sudo env PROBE_IMAGE_ID_FILE="$RUNNER_TEMP/confined-image.id" timeout --signal=TERM --kill-after=10 120 python3 scripts/confined-systemd-probe/host.py run "$RUNNER_TEMP/confined-owner"
      - name: Independent exact container cleanup after interruption
        timeout-minutes: 1
        if: always()
        run: |
          if sudo test -f "$RUNNER_TEMP/confined-owner/owner.json"; then
            sudo timeout --signal=TERM --kill-after=10 45 python3 scripts/confined-systemd-probe/host.py cleanup "$RUNNER_TEMP/confined-owner"
          fi
      - name: Remove only exact locally built image after container cleanup
        timeout-minutes: 1
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/confined-image.id"; then
            image=$(cat "$RUNNER_TEMP/confined-image.id")
            test "${#image}" = 71
            case "$image" in sha256:*) ;; *) exit 1 ;; esac
            sudo timeout --signal=TERM --kill-after=5 20 podman image rm "$image"
            set +e
            sudo timeout --signal=TERM --kill-after=5 5 podman image exists "$image"
            status=$?
            set -e
            test "$status" = 1
          fi
