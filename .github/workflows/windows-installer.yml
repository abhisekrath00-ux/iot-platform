name: Windows installer contracts
on:
  push:
    branches: [main]
    paths: ['scripts/*ps1', 'edge/packaging/*ps1', 'edge/cmd/edge-setup/**', 'scripts/build-edge.sh', '.github/workflows/windows-installer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-windows-powershell-contracts:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Windows PowerShell5.1 parsing and pure contracts (no WSL/Docker installation)
        shell: powershell
        run: |
          $PSVersionTable
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, ProductType
          & ./scripts/test-windows-desktop.ps1
          & ./scripts/test-prereq.ps1
          & ./scripts/test-remove-hexthings-windows.ps1
          & ./scripts/test-edge-windows-exits.ps1
          & ./scripts/test-edge-manager.ps1
      - name: PowerShell7 pure contracts (no WSL/Docker installation)
        shell: pwsh
        run: |
          ./scripts/test-windows-desktop.ps1
          ./scripts/test-remove-hexthings-windows.ps1
          ./scripts/test-edge-windows-exits.ps1
          ./scripts/test-edge-manager.ps1
      - name: Render actual Windows setup form (no install/start/enrollment)
        shell: powershell
        run: |
          powershell -NoProfile -STA -ExecutionPolicy Bypass -File edge/packaging/setup-wizard.ps1 -RenderPreview "$env:RUNNER_TEMP/hexthings-edge-setup.png"
          if ($LASTEXITCODE -ne 0) { throw 'Form preview failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-edge-setup-form
          path: ${{ runner.temp }}/hexthings-edge-setup.png
