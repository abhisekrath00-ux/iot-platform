name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - name: vet + test server
        working-directory: server
        run: |
          go vet ./...
          go test ./...
          go build ./...
      - name: vet + test edge
        working-directory: edge
        run: |
          go vet ./...
          go test ./...
          go build ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - working-directory: web
        run: |
          npm install
          npm run build
          npm test --if-present

  compose-smoke:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: build and boot the stack
        run: |
          set -o pipefail
          cp .env.example .env
          # retry image pulls/builds: Docker Hub rate-limits shared runner IPs
          for attempt in 1 2 3; do
            if docker compose up -d --build; then break; fi
            echo "compose up attempt $attempt failed; retrying in 15s"
            sleep 15
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
          # wait for the api to answer, up to 5 minutes (first boot migrates
          # the schema and waits on postgres health)
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz; then break; fi
            if [ "$i" = 60 ]; then
              echo "::error::api never became healthy"
              docker compose ps
              docker compose logs --tail=200 > /tmp/smoke-logs.txt 2>&1 || true
              exit 1
            fi
            sleep 5
          done
          docker compose ps
          docker compose down -v
      - name: publish smoke logs to ci-logs branch
        if: failure()
        run: |
          mkdir -p /tmp/ci-logs-publish && cd /tmp/ci-logs-publish
          git init -q .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          {
            echo "run: ${{ github.run_id }} attempt ${{ github.run_attempt }}"
            echo "sha: ${{ github.sha }}"
            echo "date: $(date -u)"
            echo "=== docker compose ps ==="
            docker compose ps 2>&1 || true
            echo "=== docker compose logs (all services, tail 400) ==="
            docker compose logs --tail=400 2>&1 || true
          } > smoke-failure.txt
          git add smoke-failure.txt
          git commit -qm "smoke failure logs for ${{ github.sha }}"
          git push -q --force origin HEAD:refs/heads/ci-logs
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - name: gofmt check
        run: |
          unformatted=$(gofmt -l server edge)
          if [ -n "$unformatted" ]; then echo "unformatted: $unformatted"; exit 1; fi
      - name: govulncheck (server + edge)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          (cd server && govulncheck ./...)
          (cd edge && govulncheck ./...)
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: npm audit (web)
        working-directory: web
        run: |
          npm install
          npm audit --audit-level=high
