name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - name: vet + test server
        working-directory: server
        run: |
          go vet ./...
          go test ./...
          go build ./...
      - name: vet + test edge
        working-directory: edge
        run: |
          go vet ./...
          go test ./...
          go build ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - working-directory: web
        run: |
          npm install
          npm run build
          npm test --if-present

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build and boot the stack
        run: |
          cp .env.example .env
          docker compose up -d --build
          # wait for the api to answer, up to 3 minutes (first boot migrates
          # the schema and waits on postgres health)
          for i in $(seq 1 36); do
            if curl -fsS http://localhost:8000/healthz; then break; fi
            if [ "$i" = 36 ]; then
              echo "api never became healthy; dumping logs"
              docker compose ps
              docker compose logs --tail=50 api postgres mosquitto
              exit 1
            fi
            sleep 5
          done
          docker compose ps
          docker compose down -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - name: gofmt check
        run: |
          unformatted=$(gofmt -l server edge)
          if [ -n "$unformatted" ]; then echo "unformatted: $unformatted"; exit 1; fi
      - name: govulncheck (server + edge)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          (cd server && govulncheck ./...)
          (cd edge && govulncheck ./...)
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: npm audit (web)
        working-directory: web
        run: |
          npm install
          npm audit --audit-level=high
