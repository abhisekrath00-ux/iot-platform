name: ci
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

# a newer push to the same ref cancels the older run to save Actions minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to post the failure log as a commit comment
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: hexmon_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # enables the API integration tests (real SQL, tenant isolation)
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/hexmon_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
          cache-dependency-path: |
            server/go.sum
            edge/go.sum
      - name: vet + test server
        working-directory: server
        run: |
          set -o pipefail
          { go vet ./... && go test ./... && go build ./...; } 2>&1 | tee /tmp/server-ci.log
      - name: MQTT ingest to dashboard API smoke (synthetic local broker)
        working-directory: server
        run: |
          set -euo pipefail
          printf 'listener 1883\nallow_anonymous true\npersistence false\n' > /tmp/mqtt-pipeline.conf
          docker run -d --name hexthings-mqtt-pipeline -p 127.0.0.1:18883:1883 -v /tmp/mqtt-pipeline.conf:/mosquitto/config/mosquitto.conf:ro eclipse-mosquitto:2
          trap 'docker rm -f hexthings-mqtt-pipeline' EXIT
          go build -o /tmp/ingest-pipeline ./cmd/ingest
          TEST_MQTT_PORT=18883 TEST_INGEST_BINARY=/tmp/ingest-pipeline go test ./cmd/api -run '^TestIntegrationMQTTPipeline$' -count=1 -v
      - name: Local mTLS service transport and ACL regression
        working-directory: server
        run: |
          set -euo pipefail
          # Avoid host-packaged service confinement on private Go test dirs.
          # Use the same disposable image as the plaintext test, non-root.
          cat > /tmp/mosquitto-test <<'SH'
          #!/bin/sh
          set -eu
          dir=$(dirname "$2")
          exec docker run --rm --label hexthings-tls-test --network host --user "$(id -u):$(id -g)" -v "$dir:$dir:ro" --entrypoint /usr/sbin/mosquitto eclipse-mosquitto:2 "$@"
          SH
          chmod +x /tmp/mosquitto-test
          trap 'docker ps -aq --filter label=hexthings-tls-test | xargs -r docker rm -f' EXIT
          TEST_MOSQUITTO_BINARY=/tmp/mosquitto-test go test ./internal/mqttconfig -run '^TestLocalMTLSTransport$' -count=1 -v
          TEST_MOSQUITTO_BINARY=/tmp/mosquitto-test TEST_INGEST_BINARY=/tmp/ingest-pipeline go test ./cmd/api -run '^TestIntegrationMQTTTLSPipeline$' -count=1 -v
      - name: Real Valkey verified TLS and ACL transport
        working-directory: server
        run: |
          set -euo pipefail
          base=https://download.valkey.io/releases
          curl -fsSLo /tmp/valkey.tar.gz "$base/valkey-9.0.7-jammy-x86_64.tar.gz"
          echo 'bf0f19982dd464ea111617608a90f1a6eaad2c9c59b2e289cbc1591129f6d2e4  /tmp/valkey.tar.gz' | sha256sum -c -
          mkdir -p /tmp/valkey-transport
          tar xzf /tmp/valkey.tar.gz -C /tmp/valkey-transport
          TEST_VALKEY_BINARY=/tmp/valkey-transport/valkey-9.0.7-jammy-x86_64/bin/valkey-server go test -race ./internal/redisx -run '^TestValkeyTransport$' -count=1 -v
      - name: vet + test edge
        working-directory: edge
        run: |
          go vet ./...
          go test ./...
          go build ./...
          # the agent must stay buildable for every shipped target
          for t in linux/arm64 windows/amd64 windows/arm64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/edge-agent
          done
      - name: post failing server log as a commit comment
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -v 'migration applied' /tmp/server-ci.log 2>/dev/null | grep -E 'FAIL|---|panic|_test.go|error|cannot|undefined' | head -60; echo '```'; } > /tmp/body.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@/tmp/body.md || true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22' }
      - working-directory: web
        run: |
          npm install
          npm run build
          npm test --if-present

  compose-smoke:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v6
      - name: Patroni embedded Python syntax and indentation regression
        run: python3 scripts/test-patroni-embedded-python.py
      - name: HA HTTP checkpoint loopback regression
        run: python3 scripts/test-check-ha-http.py
      - name: Validate generated external shared-cache Compose contract
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          bash scripts/install-ha.sh render --nodes a=10.0.0.11,b=10.0.0.12,c=10.0.0.13 --vip 10.0.0.10 --out "$out" --shared-cache-mtls
          for node in a b c; do
            if docker compose --project-directory "$out/$node" -f "$out/$node/docker-compose.yml" config > /dev/null 2>&1; then
              echo 'missing shared authority was accepted'; exit 1
            fi
            SHARED_CACHE_AUTHORITY='fixture:dummy@cache.example.invalid:6379/2' docker compose --project-directory "$out/$node" -f "$out/$node/docker-compose.yml" config --quiet
          done
          rm -rf "$out"
      - name: Validate generated etcd mutual-TLS Compose contracts
        run: |
          set -euo pipefail
          for mode in default shared; do
            out=$(mktemp -d)
            args=()
            if [ "$mode" = shared ]; then args+=(--shared-cache-mtls); fi
            bash scripts/install-ha.sh render --nodes a=10.0.0.11,b=10.0.0.12,c=10.0.0.13 --vip 10.0.0.10 --out "$out" --etcd-mtls "${args[@]}"
            for node in a b c; do
              SHARED_CACHE_AUTHORITY='fixture:dummy@cache.example.invalid:6379/2' docker compose --project-directory "$out/$node" -f "$out/$node/docker-compose.yml" config --quiet
            done
            rm -rf "$out"
          done
      - name: Exercise generated etcd TLS flags on disposable loopback members
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          curl --fail --location --silent --show-error https://storage.googleapis.com/etcd/v3.5.35/etcd-v3.5.35-linux-amd64.tar.gz -o "$tmp/etcd.tar.gz"
          echo "ca9f94cdc80be66923ef571d82b128819d0f5f3aa9f01522bafd991618ee29d1  $tmp/etcd.tar.gz" | sha256sum --check --strict
          tar -xzf "$tmp/etcd.tar.gz" -C "$tmp" --strip-components=1
          python3 -m venv "$tmp/patroni"
          "$tmp/patroni/bin/pip" install --disable-pip-version-check --require-hashes -r deploy/ha/patroni/build-requirements.lock
          "$tmp/patroni/bin/pip" install --disable-pip-version-check --require-hashes --no-build-isolation -r deploy/ha/patroni/requirements.lock
          "$tmp/patroni/bin/pip" check
          ETCD_BINARY="$tmp/etcd" PATRONI_PYTHON="$tmp/patroni/bin/python" python3 scripts/test-ha-etcd-tls.py
      - name: Build pinned Patroni image and check non-root runtime
        timeout-minutes: 12
        run: |
          set -euo pipefail
          image=hexthings-patroni-ci:${GITHUB_SHA}
          docker build --pull --tag "$image" deploy/ha/patroni
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = postgres
          docker run --rm --network none --entrypoint /bin/sh "$image" -ec '
            test "$(id -un)" = postgres
            test "$(id -u)" != 0
            postgres --version | grep -E "PostgreSQL\) 16\."
            /opt/patroni/bin/python -c "import sys, importlib.metadata as m; assert sys.version_info[:2] == (3, 11); assert m.version(\"patroni\") == \"4.1.5\"; import patroni.dcs.etcd3, psycopg2"
            /opt/patroni/bin/pip check
            test -x /entrypoint.sh
          '
      - name: PostgreSQL16 non-root disposable volume restart
        timeout-minutes: 3
        run: bash scripts/test-ha-postgres-image.sh "hexthings-patroni-ci:${GITHUB_SHA}"
      - name: Patroni actual repeated sole-DCS read-only recovery
        timeout-minutes: 5
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          curl --fail --location --silent --show-error https://storage.googleapis.com/etcd/v3.5.35/etcd-v3.5.35-linux-amd64.tar.gz -o "$tmp/etcd.tar.gz"
          echo "ca9f94cdc80be66923ef571d82b128819d0f5f3aa9f01522bafd991618ee29d1  $tmp/etcd.tar.gz" | sha256sum --check --strict
          tar -xzf "$tmp/etcd.tar.gz" -C "$tmp" --strip-components=1
          bash scripts/test-patroni-image-bootstrap.sh "hexthings-patroni-ci:${GITHUB_SHA}" "$tmp/etcd"
      - name: build and boot the stack
        run: |
          set -o pipefail
          cp .env.example .env
          # retry image pulls/builds: Docker Hub rate-limits shared runner IPs
          for attempt in 1 2 3; do
            if docker compose up -d --build > /tmp/compose-up.log 2>&1; then break; fi
            echo "compose up attempt $attempt failed; retrying in 15s"
            tail -20 /tmp/compose-up.log
            sleep 15
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
          # wait for the api to answer, up to 5 minutes (first boot migrates
          # the schema and waits on postgres health)
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz; then break; fi
            if [ "$i" = 60 ]; then
              echo "::error::api never became healthy"
              docker compose ps
              docker compose logs --tail=200 > /tmp/smoke-logs.txt 2>&1 || true
              exit 1
            fi
            sleep 5
          done
          docker compose ps
          docker compose down -v
      - name: publish smoke logs to ci-logs branch
        if: failure()
        run: |
          mkdir -p /tmp/ci-logs-publish && cd /tmp/ci-logs-publish
          git init -q .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          {
            echo "run: ${{ github.run_id }} attempt ${{ github.run_attempt }}"
            echo "sha: ${{ github.sha }}"
            echo "date: $(date -u)"
            echo "=== compose up output ==="
            cat /tmp/compose-up.log 2>/dev/null || echo "(no compose-up log)"
            echo "=== docker compose ps ==="
            docker compose -f "$GITHUB_WORKSPACE/docker-compose.yml" ps 2>&1 || true
            echo "=== docker compose logs (all services, tail 400) ==="
            docker compose -f "$GITHUB_WORKSPACE/docker-compose.yml" logs --tail=400 2>&1 || true
          } > smoke-failure.txt
          git add smoke-failure.txt
          git commit -qm "smoke failure logs for ${{ github.sha }}"
          git push -q --force origin HEAD:refs/heads/ci-logs
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
          cache-dependency-path: |
            server/go.sum
            edge/go.sum
      - name: gofmt check
        run: |
          unformatted=$(gofmt -l server edge)
          if [ -n "$unformatted" ]; then echo "unformatted: $unformatted"; exit 1; fi
      - name: govulncheck (server + edge)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          (cd server && govulncheck ./...)
          (cd edge && govulncheck ./...)
      - uses: actions/setup-node@v6
        with: { node-version: '22' }
      - name: Update npm (registry retired legacy audit endpoint)
        run: npm install -g npm@latest
      - name: npm audit (web)
        working-directory: web
        run: |
          npm install
          npm audit --audit-level=high
